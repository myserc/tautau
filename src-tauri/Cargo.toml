[package]
name = "primetime-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0" }

[dependencies]
tauri = { version = "2.0" }
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "kad", "mdns", "noise", "yamux", "tcp", "macros", "request-response", "json", "cbor", "autonat", "relay", "dcutr", "identify"] }
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sled = "0.34"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
lazy_static = "1.4"
parking_lot = "0.12"
bincode = "1.3"
futures = "0.3"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
blake3 = "1.8.3"

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
